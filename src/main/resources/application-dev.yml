# Development Profile Configuration
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_dev
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025

# JWT_SECRET is read from the shared application.yml configuration.
# Generate a unique Base64-encoded 256-bit key for local development.

payment:
  stripe:
    api-key: ${STRIPE_API_KEY:}
  paypal:
    mode: sandbox

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.web: DEBUG
