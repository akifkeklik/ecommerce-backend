# Development Profile Configuration
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

# JWT_SECRET is read from the shared application.yml configuration.
# Generate a unique Base64-encoded 256-bit key for local development.

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.web: DEBUG
