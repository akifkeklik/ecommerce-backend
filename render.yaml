# One-click demo on Render: the API (Docker) and a PostgreSQL database.
# Free tier: the API sleeps after 15 minutes idle; Render's free PostgreSQL expires after 30 days.
services:
  - type: web
    name: ecommerce-backend-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase: { name: ecommerce-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: ecommerce-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: ecommerce-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: ecommerce-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: ecommerce-db, property: password }
      # Random 256-bit, Base64-encoded signing key, created once by Render.
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: simulated
      - key: CORS_ALLOWED_ORIGINS
        value: https://ecommerce-backend-api.onrender.com
      # The demo has no Redis or SMTP server: the app falls back to an in-memory cache and logs
      # e-mails it cannot send, so those two must not mark the service unhealthy.
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        value: ""
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"
      - key: MANAGEMENT_HEALTH_MAIL_ENABLED
        value: "false"
      # Swagger UI is the demo's front end.
      - key: SPRINGDOC_SWAGGER_UI_ENABLED
        value: "true"
      - key: SPRINGDOC_API_DOCS_ENABLED
        value: "true"
      # 512 MB instance and a small free database.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "1"
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -Xss512k"

databases:
  - name: ecommerce-db
    plan: free
    region: frankfurt
    databaseName: ecommerce
    postgresMajorVersion: "16"
