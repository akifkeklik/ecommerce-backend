# Demo on Render: the API (Docker). The database is an external PostgreSQL (the live demo uses Neon's free
# plan, which does not expire like Render's free database). Its connection values are entered once in the
# Render dashboard (sync: false), never committed. Free tier: the API sleeps after 15 minutes idle.
services:
  - type: web
    name: ecommerce-backend-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Neon accepts encrypted connections only.
      - key: DB_SSLMODE
        sync: false
      # Random 256-bit, Base64-encoded signing key, created once by Render.
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: simulated
      - key: CORS_ALLOWED_ORIGINS
        value: https://ecommerce-backend-api-rxk3.onrender.com
      # The demo has no Redis or SMTP server: the app falls back to an in-memory cache and logs
      # e-mails it cannot send, so those two must not mark the service unhealthy.
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        value: ""
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"
      - key: MANAGEMENT_HEALTH_MAIL_ENABLED
        value: "false"
      # Swagger UI is the demo's front end. springdoc reads these through property conditions
      # (SPRINGDOC_API_DOCS_ENABLED form) and configuration binding (SPRINGDOC_APIDOCS_ENABLED form),
      # so both spellings are set; RenderBlueprintStartupTest checks Swagger is actually served.
      - key: SPRINGDOC_API_DOCS_ENABLED
        value: "true"
      - key: SPRINGDOC_APIDOCS_ENABLED
        value: "true"
      - key: SPRINGDOC_SWAGGER_UI_ENABLED
        value: "true"
      - key: SPRINGDOC_SWAGGERUI_ENABLED
        value: "true"
      # 512 MB instance and a small free database.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "1"
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -Xss512k"

